name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a build manually from the Actions tab

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install the R packages your posts need. `rmarkdown` (which pulls in
      # `knitr`) is required for Quarto to run any R at all. As you write posts
      # that use other packages (ggplot2, dplyr, ...), add them to this list.
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr

      - name: Render site
        run: quarto render

      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --dir=_site --prod --message "Deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
  resources:
    - "_headers"        # Netlify security headers, copied into _site/

website:
  title: "Douglas A. Parry"
  description: "Media psychologist studying digital media, cognition, and well-being."
  site-url: "https://dougaparry.com"
  favicon: images/favicon.png
  search: false
  navbar:
    logo: ""
    title: "Doug Parry"
    left:
      - href: index.qmd
        text: About
      - href: publications.qmd
        text: Publications
    right:
      - href: files/curriculum_vitae.pdf
        text: CV
        target: _blank
      - icon: envelope
        href: mailto:d.a.parry@vu.nl
        aria-label: Email
  page-footer:
    left: "© 2026 Douglas A. Parry"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: false
    grid:
      body-width: 820px
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1.9.4/css/academicons.min.css">
